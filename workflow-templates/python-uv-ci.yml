# Unit tests for a uv-managed Python repo. No secrets and no model calls on purpose.
name: ci

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q
